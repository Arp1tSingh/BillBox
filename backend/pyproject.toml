[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "billbox-backend"
version = "0.1.0"
description = "BillBox API — household receipts, search and extraction"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.6,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "supabase>=2.13,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# Section 2: upload validation, PDFs, retries and Gemini.
capture = [
  "filetype>=1.2,<2",
  "google-genai>=1.0,<2",
  "pypdf>=5.1,<7",
  "python-multipart>=0.0.20,<1",
  "tenacity>=9,<10",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: requires local Supabase and the E2E environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
