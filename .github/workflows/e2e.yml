name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 02:30 UTC, so a broken regression is found before the day starts.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  section1:
    name: Section 1 checkpoint (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_E2E: '1'
      API_BASE_URL: http://127.0.0.1:8000
      APP_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Export Supabase keys for the tests
        shell: bash
        run: |
          status="$(supabase status -o env)"
          eval "$(printf '%s\n' "$status" | sed -E \
            -e 's/^API_URL=/SUPABASE_URL=/' \
            -e 's/^ANON_KEY=/SUPABASE_ANON_KEY=/' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
            -e 's/^JWT_SECRET=/SUPABASE_JWT_SECRET=/')"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$SUPABASE_JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: pip install -e 'backend[dev]'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit

      - name: API-level E2E
        run: python -m pytest backend -m e2e -q

      - name: Playwright E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
